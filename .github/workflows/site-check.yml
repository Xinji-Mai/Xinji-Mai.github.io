name: Check academic homepage
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with GitHub Pages dependencies
        run: bundle exec jekyll build --trace
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: _site
          retention-days: 3
