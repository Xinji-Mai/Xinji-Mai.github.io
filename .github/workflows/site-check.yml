name: Check academic homepage
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with GitHub Pages dependencies
        run: bundle exec jekyll build --trace
      - name: Check pages, assets, language controls, and game
        run: |
          python3 scripts/check-site.py _site
          node scripts/preferences-smoke.cjs
          node scripts/game-smoke.cjs assets/js/tasty-world.js _pages/game.md
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: _site
          retention-days: 3
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy checked site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
