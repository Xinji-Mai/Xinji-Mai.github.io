---
layout: research
---
<article class="prose">
  <div class="resource-links"><a class="resource-link" href="{{ page.link }}">{{ page.link_label | default: 'GitHub' }} ↗</a>{% if page.paperurl %}<a class="resource-link" href="{{ page.paperurl }}"><span class="i18n-en">Paper</span><span class="i18n-zh">论文</span> ↗</a>{% endif %}{% if page.modelurl %}<a class="resource-link" href="{{ page.modelurl }}"><span class="i18n-en">Models</span><span class="i18n-zh">模型</span> ↗</a>{% endif %}{% if page.demourl %}<a class="resource-link" href="{{ page.demourl }}"><span class="i18n-en">Demo</span><span class="i18n-zh">体验</span> ↗</a>{% endif %}<a class="resource-link" href="{{ '/portfolio/' | relative_url }}"><span class="i18n-en">All projects</span><span class="i18n-zh">全部项目</span></a></div>
  {% if page.figure %}<figure class="detail-image"><img src="{{ page.figure | relative_url }}" alt="{{ page.figure_alt | escape }}"></figure>{% endif %}
  {{ content }}
</article>
